apiVersion: apps/v1
kind: Deployment
metadata:
  name: adlex-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: adlex-api}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: adlex-api}
    spec:
      containers:
        - name: api
          image: adlex:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: adlex-config}
            - secretRef:    {name: adlex-secrets}
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits:   {cpu: "1",    memory: "512Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: adlex-api
spec:
  selector: {app: adlex-api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adlex
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adlex-api
                port: {number: 80}
