apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None            # headless: DNS-имя ведёт прямо на под StatefulSet
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: adlex}
            - {name: POSTGRES_DB, value: adlex}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: adlex-secrets, key: POSTGRES_PASSWORD}
            # Данные в подкаталоге: initdb не любит непустую точку монтирования.
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "adlex", "-d", "adlex"]}
            periodSeconds: 5
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits:   {memory: "1Gi"}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
